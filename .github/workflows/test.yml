name: Test PHP security check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Read-only scan smoke test
        run: python tools/php_security_scan.py --no-color
      - name: Shell launcher syntax
        if: runner.os == 'Linux'
        run: sh -n tools/php-security-check.sh
